name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure environment files from repository secrets
        run: |
          mkdir -p src/environments
          cat << 'EOF' > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}',
            storageBucket: 'inventory-photos',
            maxPhotoSizeBytes: 10 * 1024 * 1024
          };
          EOF
          cp src/environments/environment.prod.ts src/environments/environment.ts

      - name: Build Angular app for GitHub Pages
        run: npm run build:gh

      - name: Ensure 404.html exists for SPA fallback
        run: cp dist/inventario-app/browser/index.html dist/inventario-app/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/inventario-app/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
